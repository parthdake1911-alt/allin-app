<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All In · lock the trip</title>
<meta name="description" content="All In: friends pay their share to say yes, and the trip locks. Try it and tell Parth what you think.">
<meta property="og:title" content="All In · stop chasing, lock the trip">
<meta property="og:description" content="Friends pay their share to say yes. Enough in? The trip locks. 3 minutes. Tell Parth what you think.">
<meta property="og:image" content="https://allin-app.vercel.app/og.jpg">
<meta property="og:url" content="https://allin-app.vercel.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFA45D">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: a real phone app. On a phone it fills the screen; on a laptop it sits in a device frame. Light brand theme only, by brand rule. */
:root{
  --bg:#F1F5F5; --card:#FFFFFF; --ink:#10262E; --ink2:#4A5F65; --ink3:#7A8B90; --line:#DCE5E5;
  --pine:#016A6D; --pine2:#01595B; --mint:#DDEFEE; --mint2:#9FD5D1; --sea:#1C9290; --nile:#043E52;
  --tang:#FFA45D; --peach:#FFE4CC; --sunset:#E16A3D; --sunset-t:#A8461F; --cream:#FDF6EE;
  --display:'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --hand:'Kalam', 'Comic Sans MS', cursive;
  --sh:3px 3px 0 var(--ink); --sh4:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#E4EBEB;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
/* device */
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:600px) and (min-height:700px){
  .device{width:390px;height:min(844px,calc(100% - 40px));border-radius:44px;box-shadow:0 0 0 10px var(--ink),0 0 0 12px #2a3f47,0 30px 60px rgba(16,38,46,.35)}
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--bg)}
/* header band */
.band{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1.5px solid var(--ink);display:flex;flex-direction:column;gap:10px;flex:none}
.band.peach{background:var(--peach)} .band.mint{background:var(--mint)} .band.teal{background:var(--mint2)} .band.plain{background:var(--bg);border-bottom:0}
.navrow{display:flex;align-items:center;gap:12px;min-height:44px}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;transition:transform .12s,box-shadow .12s}
.back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.over{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.over.p{color:var(--pine)}
.h1{font-family:var(--display);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase;letter-spacing:.005em;margin:0;text-wrap:balance}
.h1.xl{font-size:48px}
.sub{color:var(--ink2);font-size:14.5px;margin:0}
.title-sm{font-size:15px;font-weight:600}
/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--pine);color:#fff;font-weight:600;font-size:15.5px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,background .2s;text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:var(--card);color:var(--pine)}
.btn.tang{background:var(--tang);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--pine);font-weight:600;padding:10px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.ic{width:20px;height:20px;flex:none}
.ic.s{width:16px;height:16px}
/* cards */
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh4);padding:16px;position:relative}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.card.sel{background:var(--mint);border-color:var(--pine)}
.card.peach{background:var(--peach)}
.card.pine{background:var(--pine);color:#fff}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer}
.opt .ico{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none;border:1.5px solid var(--line)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.sel .radio,.radio.on{background:var(--pine);border-color:var(--pine)}
.radio svg{opacity:0}.sel .radio svg,.radio.on svg{opacity:1}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:#fff}
.dot.on::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--pine)}
.lbl{font-size:14px;font-weight:600;color:var(--ink2)}
.field{width:100%;min-height:52px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:0 16px;font-size:16px;outline:none}
.field:focus{border-color:var(--pine);box-shadow:0 0 0 3px var(--mint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;transition:background .15s}
.chip.on{background:var(--mint);border-color:var(--pine);color:var(--pine)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;background:var(--mint);color:var(--ink)}
.tag.peach{background:var(--peach)}.tag.white{background:#fff;border:1px solid var(--line)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:none;border:0;background:#fff;border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--mint);color:var(--pine);font-weight:600}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--mint);border-radius:14px;padding:14px;font-size:13.5px}
.note.peach{background:var(--peach)}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.num{font-family:var(--display);font-weight:900;font-variant-numeric:tabular-nums}
.divl{border-top:1px solid var(--line)}
/* avatars */
.av{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:#fff}
.av.lg{width:48px;height:48px;font-size:18px}
.av.sm{width:30px;height:30px;font-size:12px}
.av.dash{border-style:dashed;background:transparent}
.avs{display:flex;gap:6px;flex-wrap:wrap}
/* ticket */
.tk{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh4);overflow:hidden}
.tk-h{background:var(--pine);color:#fff;padding:12px 16px;display:flex;justify-content:space-between}
.tk-b{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tk .city{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;text-transform:uppercase}
.tk .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tk .v{font-weight:600;font-size:15px}
.dash-arrow{flex:1;border-top:2px dashed var(--ink);margin:0 10px;position:relative;top:4px}
.dash-arrow::after{content:"";position:absolute;right:-2px;top:-6px;width:8px;height:8px;border-right:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
/* perks tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{border-radius:10px;padding:8px 10px;background:var(--tang);color:var(--ink);border:2px solid transparent;transition:all .4s}
.tier b{font-family:var(--display);font-size:26px;font-weight:900;display:block;line-height:1}
.tier span{font-size:12px}
.tier.off{background:transparent;border:2px dashed var(--tang);color:#fff}
.pill{display:inline-flex;align-items:center;font-family:var(--display);font-weight:900;font-size:18px;background:var(--tang);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;white-space:nowrap}
.seal{display:grid;place-items:center;width:58px;height:58px;font-family:var(--display);font-weight:900;font-size:19px;background:var(--tang);clip-path:polygon(50% 0,61% 9%,75% 6%,80% 20%,94% 25%,91% 39%,100% 50%,91% 61%,94% 75%,80% 80%,75% 94%,61% 91%,50% 100%,39% 91%,25% 94%,20% 80%,6% 75%,9% 61%,0 50%,9% 39%,6% 25%,20% 20%,25% 6%,39% 9%)}
/* photo */
.ph{display:block;width:100%;object-fit:cover;background:#cfdcdc}
.post{border-radius:14px;overflow:hidden;border:2px solid var(--ink);box-shadow:var(--sh4);background:#fff}
.postbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.city2{font-family:var(--display);font-weight:900;font-size:28px;line-height:.95;text-transform:uppercase}
/* nav bar */
.tabs{margin:0 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:var(--sh4);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:2px;flex:none}
.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink)}
.tabs button.on{background:var(--pine);color:#fff}
/* route */
.route{display:flex;align-items:flex-start;justify-content:space-between;position:relative;padding-top:4px}
.route::before{content:"";position:absolute;left:10%;right:10%;top:17px;border-top:2px solid var(--line)}
.route .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2);width:20%}
.route .c{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.route .done .c{background:var(--pine);border-color:var(--ink);color:#fff}
.route .now .c{background:var(--tang);border-color:var(--ink);color:var(--ink)}
.route .now{color:var(--ink);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal .w{font-family:var(--mono);font-size:11px;color:var(--ink2);padding:4px 0}
.cal button{border:0;background:transparent;height:44px;font-weight:500;font-size:15px;border-radius:0;position:relative}
.cal button.mut{color:#B6C3C5}
.cal button.in{background:var(--mint)}
.cal button.end,.cal button.start{background:var(--pine);color:#fff;border-radius:10px;border:2px solid var(--ink);font-weight:700}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(16,38,46,.45);z-index:20;display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .2s ease}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;border-top:2px solid var(--ink);padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow-y:auto;animation:sheetUp .32s cubic-bezier(.2,.9,.25,1)}
.grab{width:44px;height:5px;border-radius:3px;background:#C5D2D3;align-self:center}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* toast / banner */
.banner{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:var(--sh4);padding:12px 14px;display:flex;gap:12px;align-items:center;animation:dropIn .4s cubic-bezier(.2,1.3,.4,1)}
.banner .app{width:30px;height:30px;border-radius:8px;background:var(--pine);display:grid;place-items:center;flex:none}
@keyframes dropIn{from{transform:translateY(-130%)}to{transform:none}}
.banner.out{animation:dropOut .3s ease forwards}
@keyframes dropOut{to{transform:translateY(-140%)}}
/* motion */
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d,0) * 80ms)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(var(--r,0deg))}to{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.stampin{animation:stampIn .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:.35s}
@keyframes stampIn{from{opacity:0;transform:scale(2.2) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(-12deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--mint);border-top-color:var(--pine);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check-anim{width:84px;height:84px;border-radius:50%;background:var(--pine);border:3px solid var(--ink);display:grid;place-items:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.check-anim path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.confetti i{position:absolute;width:10px;height:10px;border-radius:50%;animation:conf 1.8s ease-out forwards}
@keyframes conf{from{transform:translate(0,0) scale(0)}20%{transform:translate(calc(var(--x)*.3),calc(var(--y)*.3)) scale(1)}to{transform:translate(var(--x),calc(var(--y) + 240px)) scale(1) rotate(300deg);opacity:0}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
.pulse{animation:pulseRing 1.6s ease-out infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(255,164,93,.7)}100%{box-shadow:0 0 0 16px rgba(255,164,93,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
/* swipe card */
.swipe{position:relative;height:330px;margin:4px 6px}
.swipe .sc{position:absolute;inset:0;touch-action:none;user-select:none}
.sbtn{border:2px solid var(--ink);border-radius:50%;box-shadow:var(--sh);display:grid;place-items:center;background:#fff;transition:transform .12s}
.sbtn:active{transform:scale(.92)}
/* lock screen */
.lock{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;padding:calc(60px + env(safe-area-inset-top,0px)) 14px 30px;gap:12px}
.lock .time{font-family:var(--display);font-weight:800;font-size:96px;color:#fff;line-height:.9;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.lock .date{color:#fff;font-weight:600;margin-bottom:22px;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.notif{width:100%;background:rgba(255,255,255,.96);border:2px solid var(--ink);border-radius:18px;padding:12px 14px;text-align:left;box-shadow:var(--sh4)}
/* stories */
.story{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 28px;overflow:hidden}
.bars{display:flex;gap:5px}.bars i{flex:1;height:4px;border-radius:2px;background:rgba(16,38,46,.2);overflow:hidden}.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.dark .bars i{background:rgba(255,255,255,.3)}.dark .bars i b{background:#fff}
.flip{display:flex;gap:8px}
.flip span{width:70px;height:92px;background:var(--tang);color:var(--ink);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--sh4);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:72px;position:relative}
.flip span::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid rgba(16,38,46,.35)}
.polaroid{background:#fff;border:2px solid var(--ink);padding:10px 10px 0;box-shadow:var(--sh4)}
.polaroid img{display:block;width:100%;object-fit:cover}
.polaroid p{font-family:var(--hand);font-size:22px;margin:4px 2px 6px;line-height:1.2}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:52px;border:0;border-radius:12px;background:#fff;font-size:22px;font-weight:500}
.keypad button:active{background:var(--mint)}
.hand{font-family:var(--hand)}
.toggle{width:52px;height:32px;border-radius:999px;border:2px solid var(--ink);background:#fff;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.toggle.on{background:var(--pine)}.toggle.on::after{transform:translateX(20px);background:#fff}
.bar-p{height:10px;border-radius:6px;background:#E3DED6;overflow:hidden;border:1.5px solid var(--ink)}
.bar-p i{display:block;height:100%;background:var(--pine);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px}
/* v2: seats, hero, live feed */
.hero{background:var(--pine);color:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:var(--sh4);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .big{font-family:var(--display);font-weight:900;font-size:64px;line-height:.85;font-variant-numeric:tabular-nums}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.seat{aspect-ratio:1/1.05;border-radius:12px;border:2px dashed rgba(255,255,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.75);position:relative;transition:background .3s,border-color .3s}
.seat.in{background:#fff;border:2px solid var(--ink);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.seat.in.fresh{animation:seatIn .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes seatIn{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.seat .av{width:32px;height:32px;font-size:13px}
.seat.lockline::after{content:"";position:absolute;right:-6px;top:-6px;bottom:-6px;border-right:3px solid var(--tang)}
.lockflag{position:absolute;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--tang);color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;white-space:nowrap}
.meter{height:12px;border-radius:7px;background:rgba(255,255,255,.18);overflow:hidden;border:1.5px solid rgba(255,255,255,.4)}
.meter i{display:block;height:100%;background:var(--tang);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.feed{display:flex;flex-direction:column;gap:8px}
.feed .it{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.feed .it.new{animation:feedIn .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes feedIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .tr{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:var(--tang);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:36px;line-height:.9;text-align:center}
.countdown{display:flex;gap:6px}
.countdown span{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);border-radius:8px;padding:4px 8px;font-family:var(--mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:14px}
.step button{width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:#fff;box-shadow:var(--sh);font-size:22px;font-weight:700}
.step button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.step b{font-family:var(--display);font-size:40px;min-width:48px;text-align:center}
.amt-chips .chip{font-family:var(--display);font-size:20px;font-weight:900;padding:6px 16px}
.how{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start}
.how .n{width:28px;height:28px;border-radius:50%;background:var(--tang);border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.wiggle{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:none}90%{transform:rotate(-6deg)}94%{transform:rotate(6deg)}}
.split-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.split-row:first-child{border-top:0}

/* brand motion kit (same language as Trip Wrapped) */
.k{display:inline-block;opacity:0;transform:translateY(60%) rotate(4deg);animation:kin .55s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes kin{to{opacity:1;transform:none}}
.slam{opacity:0;animation:slam .42s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes slam{from{opacity:0;transform:scale(2.4) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(-12deg)}}
.drop{opacity:0;animation:drop .6s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-200px) rotate(-20deg)}to{opacity:1;transform:rotate(var(--r,0deg))}}
.sticker{position:absolute;filter:drop-shadow(2px 2px 0 #10262E);pointer-events:none}
.spinS{animation:spinS 12s linear infinite}@keyframes spinS{to{transform:rotate(360deg)}}
.floaty{animation:floaty 3s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-8px) rotate(8deg)}}
.odo{display:flex;gap:5px}
.odo .d{width:var(--w,46px);height:var(--h,66px);background:var(--tang);border:2.5px solid #10262E;border-radius:10px;overflow:hidden;position:relative;box-shadow:3px 3px 0 #10262E}
.odo .d::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#10262E;opacity:.3}
.odo .s{display:flex;flex-direction:column;transition:transform 1.5s cubic-bezier(.2,.8,.2,1)}
.odo .s span{height:var(--h,66px);display:flex;align-items:center;justify-content:center;font:900 calc(var(--h,66px) * .78)/1 var(--display);color:#10262E}
.odo .sep{align-self:flex-end;font:900 calc(var(--h,66px) * .6)/1 var(--display);color:inherit;padding-bottom:4px}
.flyup{position:absolute;right:16px;top:44px;background:var(--tang);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;font-family:var(--display);font-weight:900;font-size:20px;box-shadow:2px 2px 0 var(--ink);animation:flyup 1.4s cubic-bezier(.2,.9,.3,1) forwards;pointer-events:none;z-index:3}
@keyframes flyup{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1;transform:translateY(-18px) scale(1)}100%{opacity:0;transform:translateY(-36px)}}

/* ===== v3: pop style from reference 1 (flat pop colour, soft lifted cards, gloss, rounded type) ===== */
:root{
  --head:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gloss:inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(16,38,46,.12);
  --float:0 20px 30px -14px rgba(16,38,46,.38), 0 6px 12px -6px rgba(16,38,46,.2);
  --soft:0 10px 22px -12px rgba(16,38,46,.35);
  --bg:#F6F2EC; --line:#E6E0D8;
}
body{font-family:var(--body)}
.device{background:var(--bg)}
.screen{background:var(--bg)}

.btn{border:0;border-radius:16px;box-shadow:0 12px 20px -12px rgba(1,106,109,.8),var(--gloss);font-family:var(--body);font-weight:600;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:btnshine 4.5s ease-in-out infinite}
@keyframes btnshine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn.sec{background:#fff;color:var(--pine);box-shadow:var(--soft),inset 0 0 0 1.5px var(--pine)}
.btn.sec::after,.btn.tang::after{display:none}

.field{border:0;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line),var(--soft);font-family:var(--body)}

.tag{font-family:var(--body);font-weight:600}
.note{border-radius:18px}
.av{border:0;border-radius:12px;box-shadow:var(--gloss),0 4px 8px -4px rgba(16,38,46,.4)}

.tk{border:0;border-radius:22px;box-shadow:var(--float)}

.tabs{border:0;border-radius:999px;box-shadow:var(--float);padding:6px}
.tabs button{border-radius:999px;font-family:var(--body)}
.tabs button.on{background:var(--ink);color:#fff}
.sheet{border-top:0;border-radius:30px 30px 0 0;box-shadow:0 -20px 40px -20px rgba(16,38,46,.4);background:var(--bg)}

.post{border:0;border-radius:22px;box-shadow:var(--float)}

.toggle{border:0;box-shadow:inset 0 0 0 2px var(--ink)}
.keypad button{box-shadow:var(--soft);font-family:var(--body)}
.how .n{border:0;box-shadow:var(--gloss)}
.sbtn{border:0;box-shadow:var(--float),var(--gloss)}
.feed .it{border:0;box-shadow:var(--soft);border-radius:16px}
/* motion helpers */
.hov{animation:hov 5.5s ease-in-out infinite}
.drop.hov{opacity:1;transform:rotate(var(--r,0deg))}
@keyframes hov{50%{translate:0 -6px}}
.ticks{display:flex;gap:3px;align-items:center;justify-content:center}.ticks i{width:2px;height:8px;border-radius:2px;background:currentColor;opacity:.35}.ticks i.on{height:12px;opacity:1}
.tile{width:66px;height:66px;border-radius:20px;background:var(--ink);display:grid;place-items:center;box-shadow:var(--float),var(--gloss)}
.tile svg{width:44px}
.spot::before{content:"";position:absolute;left:50%;top:-40px;width:150%;height:80%;transform:translateX(-50%);background:radial-gradient(ellipse 45% 70% at 50% 0%,rgba(255,236,214,.34),rgba(255,236,214,.08) 55%,transparent 75%);pointer-events:none;z-index:0;animation:spotpulse 6s ease-in-out infinite}
.spot::after{content:"";position:absolute;left:50%;top:0;width:46%;height:64%;transform:translateX(-50%);background:linear-gradient(rgba(255,236,214,.24),transparent);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(10px);pointer-events:none;z-index:0}
@keyframes spotpulse{50%{opacity:.75}}
.grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.gc{position:absolute;left:9%;right:9%;height:64px;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 12px;box-shadow:var(--float),var(--gloss);font-weight:700;font-size:15px;text-align:left}
.gc .sub{display:block;font-weight:600;font-size:12.5px;opacity:.75}
.gc .pl{margin-left:auto;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--sunset);color:#fff;box-shadow:var(--gloss)}
.phf{position:absolute;border-radius:18px;overflow:hidden;box-shadow:var(--float);border:3px solid #fff}
.phf img{display:block;width:100%;height:100%;object-fit:cover}
.fchip{position:absolute;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#fff;color:var(--ink);box-shadow:var(--float)}
.strike{position:relative}.strike::after{content:"";position:absolute;left:0;top:55%;height:2px;background:currentColor;width:0;animation:strike .4s ease forwards;animation-delay:var(--sd,1.2s)}
@keyframes strike{to{width:100%}}
.rise{animation:rise .55s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--d,0) * 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- router ---------- */
const stack = []; let curEl = null, curName = null, busy = false;
function build(name, arg){
  const def = SCREENS[name](arg);
  const el = document.createElement('section'); el.className = 'screen'; el.dataset.name = name;
  if (def.bg) el.style.background = def.bg;
  el.innerHTML = def.html; el._def = def; return el;
}
function mount(el){ dev.appendChild(el); kinetic(el); if (el._def.after) el._def.after(el); }
function nav(name, arg, how = 'push'){
  if (busy) return; busy = true;
  const el = build(name, arg); const old = curEl;
  if (how === 'push' && curName) stack.push({name:curName, arg:curEl._arg});
  if (how === 'reset') stack.length = 0;
  el._arg = arg; mount(el); curEl = el; curName = name;
  if (old) old._def.leave && old._def.leave(old);
  const done = () => { if (old) old.remove(); busy = false; };
  if (!old || reduce){ done(); return; }
  const o = {duration:how === 'fade' || how === 'reset' ? 260 : 380, easing:'cubic-bezier(.2,.85,.25,1)', fill:'forwards'};
  if (how === 'push'){ old.animate([{transform:'none'},{transform:'translateX(-28%)', filter:'brightness(.92)'}], o); el.animate([{transform:'translateX(100%)'},{transform:'none'}], o).onfinish = done; }
  else if (how === 'back'){ dev.insertBefore(el, old); old.animate([{transform:'none'},{transform:'translateX(100%)'}], o).onfinish = done; el.animate([{transform:'translateX(-28%)'},{transform:'none'}], o); }
  else if (how === 'up'){ el.animate([{transform:'translateY(100%)'},{transform:'none'}], o).onfinish = done; }
  else { el.animate([{opacity:0, transform:'scale(.985)'},{opacity:1, transform:'none'}], o).onfinish = done; }
}
function back(){ const p = stack.pop(); if (p) nav(p.name, p.arg, 'back'); }
dev.addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (a){ e.preventDefault(); nav(a.dataset.go, a.dataset.arg, a.dataset.how || 'push'); return; }
  if (e.target.closest('[data-back]')){ back(); return; }
  const t = e.target.closest('[data-tab]'); if (t){ nav(t.dataset.tab, null, 'fade'); }
});

function datePick(cur, min, max, onPick){
  let view = new Date(cur + 'T00:00:00'); view.setDate(1); let sel = cur;
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  sheet(`<div class="row sp"><h2 style="margin:0">Last date to join</h2><span class="small muted">Not enough by then? Full refunds.</span></div>
    <div class="card" style="padding:12px 8px"><div class="row sp" style="padding:0 6px 8px"><button class="back" id="cp" aria-label="Previous month" style="width:40px;height:40px">${ic('left')}</button><span class="city2" id="cm" style="font-size:24px"></span><button class="back" id="cn" aria-label="Next month" style="width:40px;height:40px">${ic('right')}</button></div><div class="cal" id="cg"></div></div>
    <div class="note" id="cs" style="font-weight:600"></div><button class="btn" id="cok">Set this date</button>`, (s, close) => {
      const draw = () => { s.querySelector('#cm').textContent = view.toLocaleDateString('en-IN', {month:'long', year:'numeric'});
        const first = (view.getDay() + 6) % 7, dim = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
        let h = ['M','T','W','T','F','S','S'].map(d => `<span class="w">${d}</span>`).join('') + '<span></span>'.repeat(first);
        for (let d = 1; d <= dim; d++){ const v = iso(new Date(view.getFullYear(), view.getMonth(), d)); const off = v < min || v > max; h += `<button data-v="${v}" class="${v === sel ? 'start' : ''}" ${off ? 'disabled style="color:#B6C3C5"' : ''}>${d}</button>`; }
        s.querySelector('#cg').innerHTML = h; s.querySelector('#cs').innerHTML = `${ic('cal')} Friends can join until ${new Date(sel + 'T00:00:00').toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'})}`;
        s.querySelector('#cg').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { sel = b.dataset.v; draw(); }); };
      s.querySelector('#cp').onclick = () => { view.setMonth(view.getMonth() - 1); draw(); }; s.querySelector('#cn').onclick = () => { view.setMonth(view.getMonth() + 1); draw(); };
      s.querySelector('#cok').onclick = () => { onPick(sel); close(); }; draw(); });
}

function gangSheet(){

  else banner(`${n} is in!`, `${G.inList.length} of ${total()} · ${G.need - G.inList.length > 0 ? (G.need - G.inList.length) + ' more to lock it' : 'trip locked'}`, null, 2400);

  </div>`; }
function plansCard(){ const rahulIn = G.inList.includes('Rahul') && !G.dropDone;
  return `<div class="card rise" style="--d:3;display:flex;flex-direction:column;gap:4px"><b style="font-size:16px">If plans change</b><div class="small muted" style="margin-bottom:6px">Everyone agreed to these rules before paying.</div>
    ${[['drop','users', rahulIn ? 'Rahul can’t come anymore' : 'Someone can’t come', 'Offer their seat, or the drop-out rule applies'],['hand','spark', G.lead && G.lead !== 'Neha' ? `${G.lead} runs the trip now` : 'I can’t manage the trip', 'Hand it over to someone in the gang'],['cancel','x','Cancel the whole trip','Needs most of the gang to agree · refunds']].map(r => `<button class="row" data-edge="${r[0]}" style="border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--line);gap:12px;width:100%"><span style="width:38px;height:38px;border-radius:10px;background:${r[0] === 'cancel' ? 'var(--peach)' : 'var(--mint)'};display:grid;place-items:center;flex:none">${ic(r[1],'s')}</span><span class="grow"><b style="display:block">${r[2]}</b><span class="small muted">${r[3]}</span></span>${ic('right','s')}</button>`).join('')}</div>`; }
function startCountdown(el){ const tgt = new Date(2026, 11, G.start, 6, 0, 0); const dl = el.querySelector('#dleft'); if (!dl) return;

function bindEdges(el){ el.querySelectorAll('[data-edge]').forEach(b => b.onclick = () => ({drop:dropFlow, hand:handOver, cancel:cancelFlow})[b.dataset.edge]()); }

    <div class="how"><span class="n">1</span><div><b>We offer ${esc(who)}’s seat</b><div class="small muted">${free.length ? free.join(', ') + ' and the gang’s friends get a link' : 'The gang can share the seat link with friends'}.</div></div>

        await wait(3200); const taker = free[0] || 'Meera'; G.inList = G.inList.map(n => n === who ? taker : n); if (!G.gang.includes(taker)) G.gang.push(taker); G.gang = G.gang.filter(n => n !== who).concat(who);

const LOGO_TILE = '<svg viewBox="0 0 228 106" aria-hidden="true"><g transform="rotate(-4 114 53)"><path d="M14 3H206a14 14 0 0 1 14 14V37a16 16 0 0 0 0 32V89a14 14 0 0 1-14 14H14A14 14 0 0 1 0 89V69a16 16 0 0 0 0-32V17A14 14 0 0 1 14 3Z" fill="#FFA45D" stroke="#fff" stroke-width="6"/><line x1="140" y1="16" x2="140" y2="90" stroke="#10262E" stroke-width="6" stroke-dasharray="8 7"/><text x="72" y="78" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="64" fill="#10262E" textLength="104" lengthAdjust="spacingAndGlyphs">ALL</text><text x="180" y="78" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="64" fill="#10262E" textLength="56" lengthAdjust="spacingAndGlyphs">IN</text></g></svg>';
const wordmark = (c = 'var(--ink)') => `<div style="font-weight:800;font-size:19px;letter-spacing:-.03em;color:${c}">all<span style="display:inline-block;width:2px;height:14px;margin:0 3px;background:currentColor;opacity:.6;vertical-align:-1px"></span>in</div>`;

SCREENS.splash = () => ({bg:'var(--tang)', html:`<div style="flex:1;display:grid;place-items:center"><div class="tile pop" style="width:96px;height:96px;border-radius:28px"><span style="width:66px;display:block">${LOGO_TILE}</span></div></div>`,
  after(){ setTimeout(() => nav('welcome', null, 'fade'), reduce ? 300 : 1100); }});

SCREENS.welcome = () => ({bg:'var(--tang)', html:`<div class="bigcard" style="align-items:center;text-align:center;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 0">
  <div class="drop" style="animation-delay:.05s">${wordmark()}</div>
  <div style="position:relative;width:100%;height:220px;margin-top:8px">
    <div class="gc drop" style="top:6px;background:#fff;--r:-5deg;animation-delay:.25s"><span class="av" style="background:var(--sea);color:#fff">A</span><span>Aman<span class="sub">₹5,000</span></span><span class="pl slam" style="animation-delay:.9s">Paid</span></div>
    <div class="gc drop" style="top:68px;background:var(--mint);--r:2deg;animation-delay:.45s"><span class="av" style="background:var(--tang)">P</span><span>Priya<span class="sub">₹5,000</span></span><span class="pl slam" style="animation-delay:1.1s">Paid</span></div>
    <div class="gc drop" style="top:130px;background:var(--sea);color:#fff;--r:-2deg;animation-delay:.65s"><span class="av" style="background:#fff;color:var(--ink)">K</span><span>Karan<span class="sub strike" style="--sd:1.5s">maybe</span></span><span class="pl slam" style="background:#fff;color:var(--pine);animation-delay:1.9s">Paid</span></div>
  </div>
  <div class="tile pop" style="animation-delay:.2s;margin-top:-4px"><span style="width:44px;display:block">${LOGO_TILE}</span></div>
  <div class="ticks" style="margin:14px 0 10px"><i class="on"></i><i></i><i></i></div>
  <h1 class="h1" style="font-size:36px;margin:0">${words('Stop chasing.', .5, .08)}<br>${words('Lock the trip.', .75, .08)}</h1>
  <p class="sub rise" style="--d:12;color:var(--ink);opacity:.85;margin:10px 8px 0;font-size:14.5px">Friends say “I’m in” by paying their share. Not enough by the date? Everyone gets it back.</p>
  <div class="foot" style="background:transparent;width:100%;margin-top:auto;padding-left:0;padding-right:0"><button class="btn rise" style="--d:14" data-go="create">Start a trip ${ic('right')}</button><button class="link" id="howit" style="color:var(--ink)">How does the money work?</button></div></div>`,
  after(el){
    if (!reduce) el.querySelectorAll('.gc').forEach((g, i) => setTimeout(() => { if (g.isConnected) g.classList.add('hov'); g.style.animationDelay = (-i * 1.6) + 's'; }, 1400));
    el.querySelector('#howit').onclick = () => sheet(`<h2 style="margin:0;letter-spacing:-.02em">How the money works</h2><div class="how">
    <span class="n">1</span><div><b>You set the share</b><div class="small muted">E.g. ₹5,000 each. Usually covers the stay.</div></div>
    <span class="n">2</span><div><b>Friends pay to say yes</b><div class="small muted">It’s held safely by our payment partner, not by you or us.</div></div>
    <span class="n">3</span><div><b>Enough are in? It’s locked</b><div class="small muted">The money is released to the organisers to book, anywhere they like.</div></div>
    <span class="n">4</span><div><b>Not enough by the last date?</b><div class="small muted">Everyone gets a full refund automatically. Nobody has to ask.</div></div></div><button class="btn" data-close>Got it</button>`); }});

SCREENS.locked = () => { const amt = collected().toLocaleString('en-IN');
  return {bg:'var(--nile)', html:`<div class="bigcard spot" style="color:#fff;align-items:center;text-align:center;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 0"><div class="grain"></div>
  <div style="position:relative;z-index:2" class="drop">${wordmark('#fff')}</div>
  <div style="position:relative;width:100%;height:270px;z-index:2">
    <div class="phf drop" style="left:4%;top:26px;width:46%;height:128px;--r:-9deg;animation-delay:.3s"><img src="${IMG.bonfire}" alt=""></div>
    <div class="phf drop" style="right:2%;top:6px;width:44%;height:120px;--r:7deg;animation-delay:.5s"><img src="${IMG.palolem}" alt=""></div>
    <div class="gc drop" style="left:4%;right:4%;top:160px;background:#fff;color:var(--ink);--r:-2deg;animation-delay:.8s"><span class="av" style="background:var(--tang)">₹</span><span style="flex:1">Released to the organisers<span class="sub">to book the stay, anywhere</span></span><span class="num" style="font-size:22px" id="potv">₹0</span></div>
    <span class="fchip slam" style="left:6%;top:228px;background:var(--tang);animation-delay:1.4s">${G.inList.length} of ${total()} paid</span>
    <div class="slam" style="position:absolute;right:4%;top:214px;animation-delay:1.7s;width:84px;height:84px;border-radius:50%;border:3px solid var(--tang);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tang);background:rgba(4,62,82,.6)"><span class="num" style="font-size:16px;line-height:.9;letter-spacing:.02em">LOCKED</span><span style="font-size:8px;font-weight:700">${esc(G.place.toUpperCase())} ’26</span></div>
  </div>
  <div class="ticks" style="margin:10px 0;position:relative;z-index:2"><i></i><i></i><i class="on"></i></div>
  <h1 class="h1 xl" style="color:#fff;margin:0;position:relative;z-index:2">${words('It’s happening.', .9, .1)}<br>${words(`${G.place} is locked.`, 1.15, .1)}</h1>
  <div class="avs rise" style="--d:16;justify-content:center;margin-top:12px;position:relative;z-index:2">${G.inList.map(n => avatar(n, 'sm')).join('')}</div>
  <div class="foot" style="background:transparent;width:100%;margin-top:auto;padding-left:0;padding-right:0;position:relative;z-index:2"><button class="btn rise" id="go" style="--d:18;background:#fff;color:var(--ink)">See the trip ${ic('right')}</button></div></div>`,
  after(el){ G.celebrated = true; setTimeout(() => confetti(el), 1500); setTimeout(() => countUp(el.querySelector('#potv'), collected(), 1300), 1000);
    if (!reduce) setTimeout(() => el.querySelectorAll('.phf,.gc').forEach((g, i) => { if (g.isConnected){ g.classList.add('hov'); g.style.animationDelay = (-i * 1.7) + 's'; } }), 1800);
    el.querySelector('#go').onclick = () => nav('home', null, 'reset'); }}; };

nav('splash', null, 'fade');
})();
</script>

</body></html>
